<!doctype html>
<html lang="pl" data-accent="violet">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src nazuna:; img-src nazuna: data: https: http:; style-src nazuna: 'unsafe-inline'; script-src nazuna:">
<title>O Nazunie</title>
<link rel="stylesheet" href="nazuna://ui/theme.css">
<link rel="stylesheet" href="nazuna://ui/pages.css">
<style>
/* Naglowek strony (logo, nazwa, opis). Te same wartosci co dawniej w atrybutach
   style w about.js - wyglad Klasyczny jest dokladnie taki sam jak byl. */
.ab-glowa { text-align: center; padding: 44px 0 30px; }
.ab-znak { width: 74px; height: 74px; }
.ab-kwiat { display: none; }
.ab-nazwa { font-size: 27px; font-weight: 300; letter-spacing: 6px; margin-top: 14px; }
.ab-opis, .ab-autor { color: var(--text-faint); font-size: 12.5px; }
.ab-opis { margin-top: 8px; }
.ab-autor { margin-top: 6px; }
.ab-glowa a { color: inherit; }

/* ------------------------------------------------ Lawendowa mgla (etap 5)
   Kwiat i nazwa jak na ekranie powitalnym (kwiat rozkwita przy otwarciu),
   wersja w pigulce, wyrazny przycisk aktualizacji. Tylko w mgle. */
:root[data-motyw="mgla"] .ab-glowa {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 30px 0 34px;
}
:root[data-motyw="mgla"] .ab-znak { display: none; }
:root[data-motyw="mgla"] .ab-kwiat {
  display: block; width: 104px; height: 104px; overflow: visible; margin-bottom: 4px;
  filter: drop-shadow(0 14px 30px var(--accent-ring));
}
.ab-poswiata { fill: var(--accent); opacity: .10; }
.ab-platek, .ab-srodek { transform-box: fill-box; transform-origin: center; }
.ab-platek.p1, .ab-platek.p3 { fill: #d6ccff; }
.ab-platek.p2, .ab-platek.p4 { fill: #b3a3ff; }
.ab-srodek { fill: #ffffff; }
@keyframes abPlatek { from { transform: scale(0); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } to { transform: scale(1); } }
:root[data-motyw="mgla"] .ab-platek { animation: abPlatek .6s var(--ease) both; }
:root[data-motyw="mgla"] .ab-platek.p2 { animation-delay: .1s; }
:root[data-motyw="mgla"] .ab-platek.p3 { animation-delay: .2s; }
:root[data-motyw="mgla"] .ab-platek.p4 { animation-delay: .3s; }
:root[data-motyw="mgla"] .ab-srodek { animation: abPlatek .5s var(--ease) .42s both; }
/* letter-spacing dodaje odstep tez za ostatnia litera - padding-left go rownowazy. */
:root[data-motyw="mgla"] .ab-nazwa {
  margin-top: 0; padding-left: 10px; font-size: 21px; font-weight: 700; letter-spacing: 10px;
  color: var(--accent-strong); text-transform: lowercase;
}
:root[data-motyw="mgla"] .ab-opis {
  margin-top: 4px; max-width: 520px; font-size: 14px; line-height: 1.65; color: var(--text-dim);
}
:root[data-motyw="mgla"] .ab-wersja {
  display: inline-block; margin-left: 2px; padding: 1px 11px; border-radius: 999px;
  font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent-strong);
  background: var(--accent-dim); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.10);
}
:root[data-motyw="mgla"] .ab-autor { margin-top: 0; font-size: 12.5px; }
:root[data-motyw="mgla"] .ab-glowa a { color: var(--accent-strong); }
:root[data-motyw="mgla"] .card .tag { font-variant-numeric: tabular-nums; }

/* Przycisk aktualizacji: lawendowa pigulka, "Zainstaluj" w pelnym kolorze akcentu. */
:root[data-motyw="mgla"] #updateCard .btn {
  height: 36px; padding: 0 20px; font-weight: 700;
  color: var(--accent-strong); background: var(--accent-dim); border-color: var(--accent-ring);
}
:root[data-motyw="mgla"] #updateCard .btn:hover { background: color-mix(in srgb, var(--accent) 28%, transparent); border-color: var(--accent); }
:root[data-motyw="mgla"] #updateCard #updInstall {
  color: var(--on-accent); background: var(--accent-strong); border-color: transparent; font-weight: 800;
  box-shadow: 0 10px 26px -12px var(--accent-ring);
}
:root[data-motyw="mgla"] #updateCard #updInstall:hover { filter: brightness(1.06); }

@media (prefers-reduced-motion: reduce) {
  :root[data-motyw="mgla"] .ab-platek, :root[data-motyw="mgla"] .ab-srodek { animation: none; }
}
</style>
</head>
<body>
  <div class="page" id="page"></div>
  <script src="nazuna://ui/icons.js"></script>
  <script src="pagekit.js"></script>
  <script src="about.js"></script>
</body>
</html>
