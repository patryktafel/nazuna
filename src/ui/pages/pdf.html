<!doctype html>
<html lang="pl" data-accent="violet">
<head>
<meta charset="utf-8">
<!-- blob: w worker-src: pdf.js uruchamia swoj watek przez maly plik blob
     (skrypt watku lezy pod nazuna://ui, a strona pod nazuna://pdf, czyli
     inny host). Bez tego watek byl blokowany i caly PDF liczyl sie w glownym
     watku strony, co przy duzych plikach zamrazalo karte. -->
<meta http-equiv="Content-Security-Policy" content="default-src nazuna:; img-src nazuna: data:; style-src nazuna: 'unsafe-inline'; script-src nazuna:; worker-src nazuna: blob:">
<title>PDF</title>
<link rel="stylesheet" href="nazuna://ui/theme.css">
<link rel="stylesheet" href="nazuna://ui/washi.css">
<link rel="stylesheet" href="nazuna://ui/engawa.css">
<style>
  html, body { height: 100%; margin: 0; background: var(--bg-raised); color: var(--text); font: 13px system-ui, sans-serif; overflow: hidden; }
  #toolbar {
    height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 12px;
    background: var(--chrome-top); border-bottom: 1px solid var(--border); flex: none;
    -webkit-app-region: no-drag;
  }
  #title { font-size: 12.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 32vw; margin-right: 10px; }
  .sep { width: 1px; align-self: stretch; margin: 9px 4px; background: var(--border-strong); }
  .grow { flex: 1; }
  #pageInfo, #zoomLabel { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; padding: 0 6px; min-width: 54px; text-align: center; }
  .tbtn {
    width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); flex: none; transition: background .12s var(--ease), color .12s var(--ease);
  }
  .tbtn:hover { background: rgba(var(--tint), 0.09); color: var(--text); }
  .tbtn:active { transform: scale(.9); }
  .tbtn .icon { width: 17px; height: 17px; }
  #scroll { position: absolute; top: 46px; left: 0; right: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 16px 60px; }
  .pdf-page {
    position: relative; background: #fff; box-shadow: var(--shadow-float); border-radius: 2px; overflow: hidden;
    --total-scale-factor: 1; --scale-round-x: 1px; --scale-round-y: 1px;
  }
  .pdf-page canvas { display: block; }
  /* Warstwa tekstu z pdf.js (web/pdf_viewer.css): przezroczyste napisy nad
     canvasem, dzieki ktorym dziala zaznaczanie, kopiowanie i Ctrl+F. Mnozenie
     kolorow, zeby podswietlenie wyszukiwania nie zakrywalo liter dokumentu. */
  .textLayer {
    position: absolute; inset: 0; overflow: clip; line-height: 1; text-align: initial; z-index: 0;
    transform-origin: 0 0; letter-spacing: normal; word-spacing: normal; forced-color-adjust: none;
    color-scheme: only light; mix-blend-mode: multiply;
    --min-font-size: 1;
    --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
    --min-font-size-inv: calc(1 / var(--min-font-size));
  }
  .textLayer :is(span, br) {
    color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; user-select: text;
  }
  .textLayer > :not(.endOfContent) {
    z-index: 1;
    --font-height: 0;
    font-size: calc(var(--text-scale-factor) * var(--font-height));
    --scale-x: 1;
    --rotate: 0deg;
    transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
  }
  .textLayer ::selection { background: rgba(0, 0, 255, .25); color: transparent; }
  .textLayer br::selection { background: transparent; }
  .textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: 0; cursor: default; user-select: none; }
  .textLayer.selecting .endOfContent { top: 0; }
  .textLayer[data-main-rotation="90"] { transform: rotate(90deg) translateY(-100%); }
  .textLayer[data-main-rotation="180"] { transform: rotate(180deg) translate(-100%, -100%); }
  .textLayer[data-main-rotation="270"] { transform: rotate(270deg) translateX(-100%); }
  .warstwaLinkow { position: absolute; inset: 0; pointer-events: none; }
  .warstwaLinkow a { position: absolute; pointer-events: auto; cursor: pointer; border-radius: 2px; }
  .warstwaLinkow a:hover { background: rgba(0, 90, 255, .14); }
  #status { position: absolute; top: 46%; left: 0; right: 0; text-align: center; color: var(--text-faint); font-size: 13px; padding: 0 24px; }
  #status .btn { margin-top: 12px; }
  #haslo { position: absolute; top: 40%; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim); }
  #haslo[hidden] { display: none; }
  #hasloBlad { color: var(--danger); }
  #hasloBlad:empty { display: none; }
  #hasloPole {
    width: 240px; height: 32px; padding: 0 10px; border-radius: 8px; outline: none;
    background: var(--bg-raised); border: 1px solid var(--border-strong); color: var(--text);
  }
  .tytul-ikona { display: none; }

  /* ------------------------------------------- Lawendowa mgla (etap 5)
     Tylko pod :root[data-motyw="mgla"] (atrybut ustawia pdf.js) - wyglad
     Klasyczny bez zmian. Tresc dokumentu (canvas, warstwa tekstu, zaznaczanie,
     linki) zostaje nietknieta: zmienia sie tylko to, co wokol stron. */
  /* Tlo z przygaszonymi plamami koloru, jak na innych stronach nazuna:// w mgle
     (te same gradienty co w pages.css). Szary tekst pomocniczy odrobine jasniejszy
     (min. 4.5:1 takze w najjasniejszym miejscu nad plama). */
  :root[data-motyw="mgla"] { background: var(--bg); }
  :root[data-motyw="mgla"] body {
    --text-faint: #b0aad3;
    font-family: var(--font);
    background:
      radial-gradient(760px 540px at 6% -8%, color-mix(in srgb, var(--aurora-1) 42%, transparent) 0%, transparent 70%),
      radial-gradient(640px 520px at 102% 6%, color-mix(in srgb, var(--aurora-3) 34%, transparent) 0%, transparent 70%),
      radial-gradient(860px 620px at 72% 114%, color-mix(in srgb, var(--aurora-2) 40%, transparent) 0%, transparent 70%),
      var(--bg);
  }
  /* Pasek narzedzi: szklana belka unoszaca sie nad dokumentem (10 px od gory,
     12 px od bokow - prawa krawedz zostawia miejsce na pasek przewijania).
     Tlo jest dosc gesto zabarwione (.84), bo pod spodem przewijaja sie biale
     strony - tekst paska ma tam dalej ponad 5:1. */
  :root[data-motyw="mgla"] #toolbar {
    position: absolute; top: 10px; left: 12px; right: 12px; z-index: 3;
    height: 46px; padding: 0 6px 0 8px; gap: 4px;
    background: rgba(32, 27, 58, 0.84);
    border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 16px;
    -webkit-backdrop-filter: blur(20px) saturate(1.2); backdrop-filter: blur(20px) saturate(1.2);
    box-shadow: 0 16px 40px -18px rgba(8, 5, 25, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  :root[data-motyw="mgla"] .tytul-ikona {
    display: flex; align-items: center; justify-content: center; flex: none;
    width: 32px; height: 32px; border-radius: 50%; margin-right: 6px;
    color: var(--accent-strong); background: var(--accent-dim);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }
  :root[data-motyw="mgla"] .tytul-ikona .icon { width: 16px; height: 16px; }
  :root[data-motyw="mgla"] #title { font-size: 13px; font-weight: 600; color: var(--text); margin-right: 12px; }
  :root[data-motyw="mgla"] .sep { margin: 12px 6px; background: rgba(255, 255, 255, 0.12); }
  :root[data-motyw="mgla"] .tbtn { width: 34px; height: 34px; border-radius: 12px; }
  :root[data-motyw="mgla"] .tbtn:hover { background: rgba(255, 255, 255, 0.10); color: var(--text); }
  :root[data-motyw="mgla"] .tbtn:focus-visible { outline: none; color: var(--text); box-shadow: 0 0 0 3px var(--accent-ring); }
  :root[data-motyw="mgla"] #pageInfo,
  :root[data-motyw="mgla"] #zoomLabel {
    height: 28px; line-height: 28px; min-width: 64px; padding: 0 10px; margin: 0 2px;
    border-radius: 999px; background: rgba(255, 255, 255, 0.06); font-weight: 600;
  }
  /* Strony przewijaja sie POD szklanym paskiem (rozmywaja sie w nim).
     scroll-padding-top: "Poprzednia/Nastepna strona" (scrollIntoView)
     zatrzymuje gore strony tuz pod paskiem, a nie pod nim. */
  :root[data-motyw="mgla"] #scroll { top: 0; scroll-padding-top: 76px; }
  :root[data-motyw="mgla"] #pages { gap: 22px; padding: 76px 16px 64px; }
  :root[data-motyw="mgla"] .pdf-page {
    border-radius: 6px;
    box-shadow: 0 22px 50px -16px rgba(8, 5, 25, 0.7), 0 2px 8px rgba(8, 5, 25, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.06);
  }
  /* Okienko hasla: szklana karta na srodku. */
  :root[data-motyw="mgla"] #haslo {
    left: 50%; right: auto; transform: translateX(-50%);
    width: min(360px, calc(100% - 32px)); padding: 26px 28px 24px; gap: 12px; text-align: center;
    border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.10);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.045)), rgba(22, 19, 40, 0.62);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: var(--shadow-float);
  }
  :root[data-motyw="mgla"] #haslo > div:first-child { font-family: var(--font-display); font-size: 18px; font-weight: 500; color: var(--text); }
  :root[data-motyw="mgla"] #hasloPole {
    width: 100%; height: 38px; padding: 0 16px; border-radius: 999px;
    background: rgba(10, 8, 22, 0.38); border-color: rgba(255, 255, 255, 0.12);
    transition: border-color .14s var(--ease), box-shadow .14s var(--ease);
  }
  :root[data-motyw="mgla"] #hasloPole::placeholder { color: var(--text-faint); }
  :root[data-motyw="mgla"] #hasloPole:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
  :root[data-motyw="mgla"] #haslo .btn { min-width: 120px; }
  /* Spokojny ruch: pasek wsuwa sie z gory, strony lagodnie sie pojawiaja.
     "backwards" - po animacji nie zostaje zaden transform. */
  @keyframes mglaPasek { from { opacity: 0; transform: translateY(-6px); } }
  @keyframes mglaKartka { from { opacity: 0; transform: translateY(10px) scale(.985); } }
  @media (prefers-reduced-motion: no-preference) {
    :root[data-motyw="mgla"] #toolbar { animation: mglaPasek .3s var(--ease) backwards; }
    :root[data-motyw="mgla"] .pdf-page { animation: mglaKartka .36s var(--ease) backwards; }
  }
  /* Waskie okno: ikona pliku znika, pigulki sa wezsze - przyciski zostaja w pasku. */
  @media (max-width: 560px) {
    :root[data-motyw="mgla"] .tytul-ikona { display: none; }
    :root[data-motyw="mgla"] #pageInfo,
    :root[data-motyw="mgla"] #zoomLabel { min-width: 0; padding: 0 8px; }
  }
</style>
</head>
<body>
  <div id="toolbar">
    <span id="title"></span>
    <div class="grow"></div>
    <button class="tbtn" id="prev" title="Poprzednia strona"></button>
    <span id="pageInfo">- / -</span>
    <button class="tbtn" id="next" title="Następna strona"></button>
    <div class="sep"></div>
    <button class="tbtn" id="zoomOut" title="Pomniejsz"></button>
    <span id="zoomLabel">100%</span>
    <button class="tbtn" id="zoomIn" title="Powiększ"></button>
    <div class="sep"></div>
    <button class="tbtn" id="download" title="Pobierz plik"></button>
  </div>
  <div id="scroll"><div id="pages"></div></div>
  <div id="status"></div>
  <form id="haslo" hidden>
    <div>Ten plik PDF jest chroniony hasłem.</div>
    <div id="hasloBlad"></div>
    <input id="hasloPole" type="password" autocomplete="off" spellcheck="false" placeholder="Hasło" aria-label="Hasło do pliku PDF">
    <button class="btn primary" type="submit">Otwórz</button>
  </form>
  <script src="nazuna://ui/icons.js"></script>
  <script type="module" src="pdf.js"></script>
</body>
</html>
