<!doctype html>
<html lang="pl" data-accent="violet">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src nazuna:; img-src nazuna: data:; style-src nazuna: 'unsafe-inline'; script-src nazuna:">
<title>Historia</title>
<link rel="stylesheet" href="nazuna://ui/theme.css">
<link rel="stylesheet" href="nazuna://ui/washi.css">
<link rel="stylesheet" href="nazuna://ui/pages.css">
<style>
/* Podpowiedz pod pustym stanem jest tylko w mgle - Klasyczny wyglada jak dawniej. */
.empty-hint { display: none; }

/* ----------------------------- Lawendowa mgla: historia (etap 5)
   Wspolne rzeczy (tlo, karty, naglowek, wiersze) sa w pages.css - tu tylko to,
   co dotyczy tej strony. Wszystko pod :root[data-motyw="mgla"]. */

/* Szukajka: szklana pigulka z lupka (lupka to obrazek w tle pola, bez zmian w JS). */
:root[data-motyw="mgla"] .page-head .search {
  width: 300px; padding: 0 16px 0 40px;
  background-color: rgba(255, 255, 255, 0.07); border-color: rgba(255, 255, 255, 0.12);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b8b2da' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.6-3.6'/></svg>");
  background-repeat: no-repeat; background-position: 15px center; background-size: 16px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
:root[data-motyw="mgla"] .page-head .search:hover { border-color: rgba(255, 255, 255, 0.20); }
:root[data-motyw="mgla"] .page-head .search:focus {
  background-color: rgba(255, 255, 255, 0.10); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring);
}

/* Dni: miedzy dniami jedna delikatna linia (bez podwojnej kreski pod ostatnim wpisem). */
:root[data-motyw="mgla"] .section-date:not(:first-child) {
  margin-top: 6px; padding-top: 24px; border-top: 1px solid rgba(255, 255, 255, 0.07);
}
:root[data-motyw="mgla"] .list-item:has(+ .section-date) { border-bottom: 0; }

/* Litera strony: szklany kafelek z litera w kolorze akcentu. */
:root[data-motyw="mgla"] .list-item .fav-litera {
  width: 30px; height: 30px; border-radius: 10px; font-size: 13px; font-weight: 800;
  color: var(--accent-strong);
  background: linear-gradient(150deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.04));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09);
}
:root[data-motyw="mgla"] .list-item .when { color: var(--text-faint); }

/* Akcje przy wpisie wsuwaja sie lagodnie; widac je tez przy obsludze klawiatura. */
:root[data-motyw="mgla"] .list-item .acts {
  gap: 2px; transform: translateX(4px);
  transition: opacity .16s var(--ease), transform .16s var(--ease);
}
:root[data-motyw="mgla"] .list-item:hover .acts,
:root[data-motyw="mgla"] .list-item:focus-within .acts { opacity: 1; transform: none; }

/* Pusty stan: delikatny czteroplatkowy kwiat za ikona, przyjazny tekst. */
@keyframes mglaKwiat { to { transform: rotate(360deg); } }
:root[data-motyw="mgla"] .empty { position: relative; isolation: isolate; padding: 72px 20px; }
:root[data-motyw="mgla"] .empty::before {
  content: ""; position: absolute; z-index: -1; left: 50%; top: 20px;
  width: 168px; height: 168px; margin-left: -84px; pointer-events: none; opacity: .5;
  background:
    radial-gradient(26px 40px at 50% 27%, color-mix(in srgb, var(--accent-strong) 34%, transparent), transparent),
    radial-gradient(40px 26px at 73% 50%, color-mix(in srgb, var(--accent-strong) 34%, transparent), transparent),
    radial-gradient(26px 40px at 50% 73%, color-mix(in srgb, var(--accent-strong) 34%, transparent), transparent),
    radial-gradient(40px 26px at 27% 50%, color-mix(in srgb, var(--accent-strong) 34%, transparent), transparent);
  filter: blur(6px);
  animation: mglaKwiat 80s linear infinite;
}
:root[data-motyw="mgla"] .empty .icon { display: block; margin: 0 auto 18px; }
:root[data-motyw="mgla"] .empty > div {
  max-width: 440px; margin: 0 auto; font-family: var(--font-display); font-size: 20px; font-weight: 500;
  line-height: 1.45; color: var(--text);
}
:root[data-motyw="mgla"] .empty > .empty-hint {
  display: block; margin-top: 8px; font-family: var(--font); font-size: 13.5px; font-weight: 400; color: var(--text-faint);
}

@media (prefers-reduced-motion: reduce) {
  :root[data-motyw="mgla"] .empty::before { animation: none; }
  :root[data-motyw="mgla"] .list-item .acts { transform: none; transition: none; }
}
</style>
</head>
<body>
  <div class="page" id="page"></div>
  <script src="nazuna://ui/icons.js"></script>
  <script src="pagekit.js"></script>
  <script src="history.js"></script>
</body>
</html>
