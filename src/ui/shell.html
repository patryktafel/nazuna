<!doctype html>
<html lang="pl" data-accent="violet">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http: nazuna:; font-src 'self'; connect-src 'self'">
<title>Nazuna</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
  <header id="chrome">
    <div class="tabstrip" id="tabstrip">
      <!-- Przycisk "+" siedzi na stale wewnatrz #tabs (nie obok, patrz shell.js
           renderTabs/miejsceWstawienia), zeby zawsze stac tuz przy ostatniej
           karcie, a nie przy prawej krawedzi calego, elastycznego pudelka
           #tabs, ktore przy malej liczbie kart bywa od nich szersze. -->
      <div class="tabs" id="tabs" role="tablist" aria-label="Karty">
        <button class="tab-add" id="newtab" title="Nowa karta (Ctrl+T)"></button>
      </div>
      <div class="strip-spacer"></div>
      <div class="private-badge" id="privateBadge" hidden></div>
      <div class="wincontrols">
        <button id="min" title="Minimalizuj"></button>
        <button id="max" title="Maksymalizuj"></button>
        <button id="close" class="close" title="Zamknij"></button>
      </div>
    </div>

    <div class="toolbar">
      <button class="tool" id="back" title="Wstecz (Alt+Strzałka w lewo)"></button>
      <button class="tool" id="forward" title="Dalej (Alt+Strzałka w prawo)"></button>
      <button class="tool" id="reload" title="Odśwież (F5)"></button>
      <button class="tool" id="home" title="Strona startowa"></button>

      <div class="omnibox" id="omnibox">
        <span class="lock" id="lock"></span>
        <span class="lock-label" id="lockLabel" hidden>Niezabezpieczona</span>
        <div class="adres-pole">
          <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Wpisz adres albo wyszukaj" role="combobox" aria-label="Adres strony lub wyszukiwanie" aria-autocomplete="list" aria-expanded="false" aria-controls="omniLista">
          <div class="adres-widok" id="addressView" aria-hidden="true"></div>
        </div>
        <div class="omni-actions">
          <button class="omni-btn" id="zoomChip" hidden title="Powiększenie"></button>
          <button class="omni-btn" id="shield" title="Bloker reklam" aria-haspopup="true"></button>
          <button class="omni-btn" id="webstoreInstall" hidden title="Zainstaluj to rozszerzenie w Nazunie"></button>
          <button class="omni-btn" id="star" title="Dodaj do zakładek (Ctrl+D)"></button>
        </div>
      </div>

      <div class="ext-slot" id="extSlot" style="display:flex;gap:2px"></div>
      <button class="tool" id="bookmarksBtn" title="Zakładki" aria-haspopup="true"></button>
      <button class="tool" id="downloads" title="Pobrane (Ctrl+J)" aria-haspopup="true"></button>
      <button class="tool" id="menu" title="Menu" aria-haspopup="true"></button>
    </div>

    <div class="bookmarksbar" id="bookmarksbar" role="toolbar" aria-label="Pasek zakładek" hidden></div>

    <div class="findbar" id="findbar" hidden>
      <div class="wrap">
        <input id="findInput" type="text" placeholder="Znajdź na stronie" aria-label="Znajdź na stronie" spellcheck="false">
        <span class="count" id="findCount" role="status"></span>
        <button class="omni-btn" id="findPrev" title="Poprzedni"></button>
        <button class="omni-btn" id="findNext" title="Następny"></button>
        <button class="omni-btn" id="findClose" title="Zamknij (Esc)"></button>
      </div>
    </div>
    <div class="loadbar" id="loadbar"></div>
  </header>

  <div id="scrim"></div>
  <div id="layer"></div>

  <script src="icons.js"></script>
  <script src="shell.js"></script>
</body>
</html>
